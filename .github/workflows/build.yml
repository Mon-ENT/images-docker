name: Build and push Docker images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.base
      - modules.json
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.load.outputs.modules }}
    steps:
      - uses: actions/checkout@v6
      - name: Load modules
        id: load
        run: echo "modules=$(cat modules.json | jq -c .)" >> $GITHUB_OUTPUT

  build:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      file: Dockerfile.base
      platforms: linux/amd64,linux/arm64
      build-args: |
        MODULE_GROUP=${{ matrix.module.group }}
        MODULE_NAME=${{ matrix.module.name }}
        MODULE_VERSION=${{ matrix.module.version }}
      cache: true
      cache-scope: ${{ matrix.module.name }}
      meta-images: ghcr.io/mon-ent/${{ matrix.module.name }}
      meta-tags: |
        type=raw,value=latest
        type=raw,value=${{ matrix.module.version }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}