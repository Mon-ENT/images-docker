name: Build and push Docker images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.base
      - modules.json
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.load.outputs.modules }}
    steps:
      - uses: actions/checkout@v6
      - name: Load modules
        id: load
        run: echo "modules=$(cat modules.json | jq -c .)" >> $GITHUB_OUTPUT

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MODULE_GROUP=${{ matrix.module.group }}
            MODULE_NAME=${{ matrix.module.name }}
            MODULE_VERSION=${{ matrix.module.version }}
          tags: |
            ghcr.io/mon-ent/${{ matrix.module.name }}:latest
            ghcr.io/mon-ent/${{ matrix.module.name }}:${{ matrix.module.version }}