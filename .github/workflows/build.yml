name: Build and push Docker images

on:
  pull_request: &pr_push
    branches: [main]
    paths:
      - Dockerfile
      - modules.json
  push: *pr_push
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.load.outputs.modules }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Load modules
        id: load
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BEFORE=$(git show origin/${{ github.base_ref }}:modules.json)
            AFTER=$(cat modules.json)
            CHANGED=$(jq -cn \
              --argjson before "$BEFORE" \
              --argjson after "$AFTER" \
              '[$after[] | . as $m | select($before[] | .group == $m.group and .name == $m.name and .version != $m.version | not | not)]'
            )
            echo "modules=$CHANGED" >> $GITHUB_OUTPUT
          else
            echo "modules=$(jq -c . modules.json)" >> $GITHUB_OUTPUT
          fi

  build:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.event_name == 'push' }}
      platforms: linux/amd64,linux/arm64
      build-args: |
        MODULE_GROUP=${{ matrix.module.group }}
        MODULE_NAME=${{ matrix.module.name }}
        MODULE_VERSION=${{ matrix.module.version }}
      cache: true
      cache-scope: ${{ matrix.module.name }}
      meta-images: ghcr.io/mon-ent/${{ matrix.module.name }}
      meta-tags: |
        type=raw,value=latest
        type=raw,value=${{ matrix.module.version }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}